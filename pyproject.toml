[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name follows the product rename; the console script below
# keeps the old entry point so existing shell aliases keep working.
name = "pinchcursor"
version = "0.2.0"
description = "Touchless pointer control for macOS: hand tracking to cursor, clicks and scrolling"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.12.0",
  "mediapipe==1.1.1",
  "numpy==2.5.4",
  # mediapipe 1.1.1 depends on opencv-contrib-python; opencv-python also
  # provides `cv2` and installing both corrupts the import path.
  "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-ApplicationServices==12.2.2",
  "pyobjc-framework-AVFoundation==12.2.2",
  "pyobjc-framework-Quartz==12.2.2",
]
test = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
]
macos-build = ["pyinstaller==6.22.3"]

[project.scripts]
# New name, plus the pre-rename entry point so existing aliases keep working.
pinchcursor = "main:main"
gesture-control = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "capture*", "gui*", "utils*", "platform_services*"]
exclude = ["tests*", "data*", "models*", "assets*"]

[tool.setuptools.package-data]
core = ["models/*.task"]
gui = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Start with the rules that catch real defects: pyflakes (F), pycodestyle
# errors (E), import order (I), obsolete syntax (UP) and bugbear (B).
select = ["E", "F", "I", "UP", "B"]
# Debt measured before this gate existed: 434 lines are over the limit, almost
# all of them translated UI strings and comments a formatter cannot wrap. Drop
# E501 from this list once those files are reflowed by hand.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests hold the Qt application in a local so it outlives the widgets; no test
# reads that variable again.
"tests/**" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["core", "gui", "platform_services", "utils", "tests"]

[tool.mypy]
python_version = "3.13"
# Typing starts at the boundary the control runtime depends on. gui/,
# platform_services/ and utils/ join once core/ is clean.
files = ["core"]
# PySide6, MediaPipe and OpenCV ship incomplete stubs, so a missing third-party
# type is not an error in this first pass.
ignore_missing_imports = true
warn_unused_configs = true
