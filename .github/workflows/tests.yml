name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Blocking gate: syntax plus the whole suite. A red test fails the branch.
  tests:
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[macos,test]'
      - name: Check Python syntax
        run: python -m compileall -q core capture gui platform_services utils main.py
      - name: Run tests
        run: python -m pytest -q
  # Whole-tree gate. The tree is clean, so the check does not need to know which
  # files a push touched: any finding anywhere fails the branch.
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lint tools
        run: python -m pip install ruff==0.17.3
      - name: Lint the whole tree
        run: python -m ruff check .
